[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publicsafetyapi-sdk"
version = "0.1.0"
description = "Python SDK for publicsafetyapi.dev — US police stations, fire stations, hospitals, and EMS locations. Install: pip install publicsafetyapi-sdk · Import: from publicsafetyapi import PublicSafetyAPI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["public safety", "police", "fire station", "hospital", "ems", "hifld", "api", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage      = "https://publicsafetyapi.dev"
Documentation = "https://publicsafetyapi.dev/docs"
Repository    = "https://github.com/public-safety-api/publicsafetyapi-python"
"Bug Tracker" = "https://github.com/public-safety-api/publicsafetyapi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/publicsafetyapi"]
